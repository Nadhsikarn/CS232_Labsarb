<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TU API - Check Student</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            color: #333;
            margin-top: 0;
            border-bottom: 2px solid #ff5722;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e64a19;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ตรวจสอบรหัสนักศึกษา (TU API)</h2>
    
    <div class="form-group">
        <label for="apiUrl">API Gateway URL (ของ Lambda Auth):</label>
        <input type="text" id="apiUrl" placeholder="https://xxxxxxx.execute-api.region.amazonaws.com/prod/auth" value="">
        <small style="color: #888; font-size: 12px; display: block; margin-top: 4px;">* ใส่ URL ของ API Gateway ที่ต่อกับ Lambda</small>
    </div>

    <div class="form-group">
        <label for="studentId">รหัสนักศึกษา (10 หลัก):</label>
        <input type="text" id="studentId" placeholder="เช่น 640968XXXX" maxlength="10">
    </div>

    <button id="checkBtn" onclick="checkStudent()">ตรวจสอบข้อมูล</button>
    <div class="loading" id="loadingIndicator">กำลังตรวจสอบข้อมูล...</div>

    <pre id="result"></pre>
</div>

<script>
    async function checkStudent() {
        const studentId = document.getElementById('studentId').value.trim();
        const apiUrl = document.getElementById('apiUrl').value.trim();
        const resultDiv = document.getElementById('result');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const checkBtn = document.getElementById('checkBtn');

        if (!apiUrl) {
            alert('กรุณาใส่ API Gateway URL ก่อนครับ');
            return;
        }

        if (!studentId || studentId.length !== 10) {
            alert('กรุณากรอกรหัสนักศึกษา 10 หลักให้ครบถ้วน');
            return;
        }

        // Reset UI
        resultDiv.style.display = 'none';
        resultDiv.textContent = '';
        loadingIndicator.style.display = 'block';
        checkBtn.disabled = true;
        checkBtn.style.opacity = '0.7';

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: 'check_student',
                    student_id: studentId
                })
            });

            const data = await response.json();
            
            resultDiv.style.display = 'block';
            if (data.success) {
                resultDiv.style.borderLeft = '4px solid #4CAF50';
                resultDiv.textContent = 'พบข้อมูลนักศึกษา:\n\n' + JSON.stringify(data.data, null, 2);
            } else {
                resultDiv.style.borderLeft = '4px solid #f44336';
                resultDiv.textContent = 'ไม่พบข้อมูล / เกิดข้อผิดพลาด:\n\n' + data.message;
            }
        } catch (error) {
            resultDiv.style.display = 'block';
            resultDiv.style.borderLeft = '4px solid #f44336';
            resultDiv.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ (อาจติด CORS หรือ URL ผิด):\n\n' + error.message;
        } finally {
            loadingIndicator.style.display = 'none';
            checkBtn.disabled = false;
            checkBtn.style.opacity = '1';
        }
    }
</script>

</body>
</html>
