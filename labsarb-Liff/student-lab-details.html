<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labsarb - รายละเอียดผลงาน</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="portal-style.css">
  <link rel="stylesheet" href="student-dashboard-style.css">
  
  <link rel="stylesheet" href="student-lab-details-style.css">
</head>
<body>
  <div class="app-container" id="app-container">
    <div class="sidebar">
      <div class="sidebar-logo">
        <img src="logo.png" alt="Labsarb Logo" style="height: 40px; width: auto; object-fit: contain;">
        <div class="sidebar-logo-text">
          <h2 style="margin:0;">Labsarb</h2>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="student-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          ส่งงาน (CS232)
        </a>
        <a class="nav-item" href="student-history.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          สถานะภาพรวม
        </a>
        <a class="nav-item" href="https://courses.cs.tu.ac.th" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          เว็บไซต์รายวิชา
        </a>
      </nav>
    </div>

    <div class="main-area">
      <div class="top-user" id="profile-container">
        <div class="profile-trigger" onclick="toggleProfileCard()">
          <div class="avatar-circle">นศ</div>
          <span id="trigger-student-name">กำลังโหลด...</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <div class="profile-card" id="profile-card">
          <div class="profile-card-header">
            <div class="avatar-circle large">นศ</div>
            <div class="profile-card-name" id="card-student-name">ชื่อ นามสกุล</div>
            <div class="profile-card-id" id="card-student-id">รหัสนักศึกษา: -</div>
          </div>
          <div class="profile-card-body">
            <div class="info-row"><span class="info-label">อีเมล</span><span class="info-value" id="card-student-email">-</span></div>
            <div class="info-row"><span class="info-label">คณะ/สาขา</span><span class="info-value" id="card-student-faculty">-</span></div>
          </div>
          <div class="profile-card-footer">
            <button class="btn-logout-full" onclick="doStudentLogout()">ออกจากระบบ</button>
          </div>
        </div>
      </div>

      <div class="content-scroll">
        <div class="screen active">
          <div style="margin-bottom: 24px;">
            <a href="student-history.html" class="back-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;">
                <line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>
              </svg>
              กลับไปหน้าประวัติ
            </a>
          </div>

          <h1 class="page-title">รายละเอียดการส่งงาน</h1>
          
          <div class="detail-grid">
            <div class="detail-main-card">
              <div class="detail-header">
                <h2 id="lab-detail-title">Lab ID: -</h2>
                <span class="badge" id="lab-detail-status">กำลังโหลด...</span>
              </div>
              <div class="detail-body">
                <div class="feedback-box">
                  <label>ข้อเสนอแนะจากระบบ/อาจารย์</label>
                  <p id="lab-detail-feedback">ไม่มีข้อเสนอแนะ</p>
                </div>
              </div>
            </div>

            <div class="detail-side-card">
              <label class="info-label" style="margin-bottom:12px; display:block;">หลักฐานการส่งงาน (Screenshot)</label>
              <div class="image-preview-container">
                <img id="lab-detail-image" src="" alt="Lab Screenshot">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="student-portal.js"></script>
  <script src="student-lab-details-logic.js"></script>
</body>
</html>
