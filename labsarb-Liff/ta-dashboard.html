<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Labsarb TA - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="portal-style.css">
  <link rel="stylesheet" href="ta-dashboard-style.css">
</head>

<body>
  <div class="app-container" id="app-container">
    <div class="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon">LA</div>
        <div class="sidebar-logo-text">
          <h2>LabAdmin</h2>
          <span>Academic Management</span>
        </div>
      </div>
      <div class="sidebar-action">
        <button class="btn-primary" onclick="window.location.href='ta-create-lab.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          สร้าง LAB ใหม่
        </button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" href="ta-dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          ภาพรวม (Dashboard)
        </a>
        <a class="nav-item" href="ta-submissions.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          การส่งงาน
        </a>
        <a class="nav-item" href="ta-students.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          รายชื่อนักศึกษา
        </a>
        <a class="nav-item" href="https://courses.cs.tu.ac.th/" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          ไปยังเว็ปไซต์รายวิชา
        </a>
      </nav>
    </div>

    <div class="main-area">
      <div class="topbar">
        <div class="topbar-title">Labsarb TA Manager</div>
        <div class="topbar-actions">
          <div class="profile-circle" onclick="toggleProfileDropdown()" title="โปรไฟล์">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" style="width:16px;height:16px;">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <div class="profile-dropdown" id="profile-dropdown">
            <div class="profile-header">
              <div class="profile-avatar">TA</div>
              <div class="profile-info">
                <h4 id="dropdown-username">ผู้ใช้งาน</h4>
                <p>Teacher Assistant</p>
              </div>
            </div>
            <button class="btn-outline" onclick="doLogout()"
              style="width:100%; justify-content:center;">ออกจากระบบ</button>
          </div>
        </div>
      </div>

      <div class="content-scroll">
        <div class="screen active">
          <div class="page-header-action">
            <div class="page-header" style="margin-bottom:0;">
              <div class="page-header-small" id="dashboard-course-code">CS232</div>
              <h1 id="dashboard-course-name">ภาพรวมรายวิชา</h1>
              <p>ติดตามความคืบหน้าการส่งงานของนักศึกษาในแต่ละการทดลอง (Lab) ที่เปิดอยู่</p>
            </div>
          </div>
          <div class="dashboard-grid" id="dashboard-grid">
            </div>
          <p class="dashboard-note">ข้อมูลถูกอัปเดตอัตโนมัติจากการตรวจให้คะแนน</p>
        </div>
      </div>
    </div>
  </div>

  <script src="ta-portal.js"></script>
  <script src="ta-dashboard-logic.js"></script>
</body>
</html>
